map $http_x_jcareer_viewer_key $jcareer_rate_key {
  default $http_x_jcareer_viewer_key;
  ""      $binary_remote_addr;
}

map $http_x_jcareer_forwarded_proto $jcareer_forwarded_proto {
  default $http_x_jcareer_forwarded_proto;
  ""      $scheme;
}

map $http_x_jcareer_edge_request_id $jcareer_request_id {
  default $http_x_jcareer_edge_request_id;
  ""      $request_id;
}

limit_req_zone $jcareer_rate_key zone=api_per_ip:10m rate=5r/s;

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;

  set $api_backend http://api:8000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    limit_req zone=api_per_ip burst=20 nodelay;
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $jcareer_forwarded_proto;
    proxy_set_header X-Request-ID $jcareer_request_id;
  }

  location ~ ^/(agent|llm)(/|$) {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
