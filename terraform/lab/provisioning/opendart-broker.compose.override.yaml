services:
  opendart-broker:
    build:
      context: ./aws_broker
      args:
        RUNTIME_UID: "11001"
        RUNTIME_GID: "11001"
    network_mode: host
    environment:
      BROKER_MODE: opendart
      BROKER_REGION: ap-northeast-2
      BROKER_SOCKET_PATH: /run/jcareer-opendart/broker.sock
      BROKER_EXPECTED_PEER_UID: "11001"
      OPENDART_REFRESH_QUEUE_NAME: ${OPENDART_REFRESH_QUEUE_NAME:?OpenDART queue name required}
      OPENDART_RESULT_TABLE_NAME: ${OPENDART_RESULT_TABLE_NAME:?OpenDART result table required}
      AWS_EC2_METADATA_DISABLED: "false"
    volumes:
      - /var/run/jcareer-opendart:/run/jcareer-opendart
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=11001,gid=11001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/jcareer-opendart/broker.sock"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  api:
    environment:
      OPENDART_MODE: live
      OPENDART_DISPATCH_MODE: serverless_queue
      OPENDART_AWS_BROKER_SOCKET: /run/jcareer-opendart/broker.sock
      OPENDART_REFRESH_QUEUE_URL: ""
      OPENDART_RESULT_TABLE: ""
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - /var/run/jcareer-opendart:/run/jcareer-opendart:ro
    depends_on:
      opendart-broker:
        condition: service_healthy
