server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;

  set $api_backend http://api:8000;
  set $agent_backend http://agent:8100;
  set $llm_backend http://llm-gateway:8200;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
  }

  location /agent/ {
    proxy_pass $agent_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /agent {
    return 308 /agent/health;
  }

  location /llm/ {
    proxy_pass $llm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /llm {
    return 308 /llm/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
