name: public-release-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 공개 명세 정합성
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: TO-BE AI security provider-free source contract
        run: |
          terraform fmt -check -recursive terraform/tobe-ai-security
          python3 -B scripts/check_tobe_ai_security_static.py --root .
      - name: TO-BE AI security provider schema and mock plans
        run: |
          tobe_ci_root="$RUNNER_TEMP/jcareer-tobe-check"
          mkdir -p "$tobe_ci_root/terraform"
          cp -R terraform/tobe-ai-security "$tobe_ci_root/terraform/tobe-ai-security"
          terraform -chdir="$tobe_ci_root/terraform/tobe-ai-security" init -backend=false -input=false
          python3 -B scripts/check_tobe_provider_lock.py --root "$tobe_ci_root"
          terraform -chdir="$tobe_ci_root/terraform/tobe-ai-security" validate
          terraform -chdir="$tobe_ci_root/terraform/tobe-ai-security" test
      - name: 소스·문서 단위시험
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: 진단 대시보드 판단 데이터 계약
        run: |
          node --check assessment-dashboard/app.js
          node --check assessment-dashboard/assessment-snapshot.js
          node --test tests/assessment_dashboard_data.test.cjs
      - name: 공개 문서 수치·상태 정합성
        run: python3 -B scripts/check_public_document_consistency.py
      - name: AS-IS HTML·PDF·도면 결속
        shell: pwsh
        run: ./terraform/asis/validate-spec.ps1 -CheckOnly
      - name: MLOps 공개 명세 결속
        run: python3 -B scripts/check_public_mlops.py
      - name: 업무 단말 이미지 정의 12개 검사
        run: python3 -B scripts/check_workplace_images_static.py
      - name: 애니메이션 원본 결속
        run: |
          node scripts/finalize_animated_arch.mjs --check
          node scripts/finalize_animated_arch.mjs assets/JCAREER_FULL_INFRA_ANIMATED.svg --spec=assets/JCAREER_FULL_INFRA_ANIMATED.spec.json --check
      - name: 모바일·데스크톱 화면 검사
        run: node scripts/check_public_ui.mjs
      - name: 공개 파일 비밀정보 패턴 검사
        run: python3 -B scripts/scan_secrets.py .
      - name: 공백 오류 검사
        run: git diff --check
